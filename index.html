<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AyoWorlds — portal connecting Ayo Apps, AyoOS and Puste Kołyski.">
    <meta name="theme-color" content="#050706">
    <title>AyoWorlds</title>
    <link rel="stylesheet" href="style.css?v=20260823-2302">
</head>
<body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="hero">
        <p class="eyebrow">AYO WORLDS</p>
        <h1>Trzy światy. Jedna brama.</h1>
        <p class="lead">Wybierz portal i przejdź do jednego ze światów Ayo.</p>
    </header>

    <main class="worlds" aria-label="Światy Ayo">
        <a class="world world-apps" href="https://klucznik26.github.io/AyoWWW/" aria-label="Otwórz Pakiet Ayo">
            <span class="world-glow" aria-hidden="true"></span>
            <span class="world-copy">
                <span class="world-number">01</span>
                <img class="world-title-image world-title-apps" src="RubinAyoTools.png" alt="AyoTools">
                <small>Aplikacje i narzędzia</small>
                <span class="enter">Wejdź <span aria-hidden="true">→</span></span>
            </span>
        </a>

        <a class="world world-os" href="#" aria-label="AyoOS — w przygotowaniu" data-coming-soon>
            <span class="world-glow" aria-hidden="true"></span>
            <span class="world-copy">
                <span class="world-number">02</span>
                <img class="world-title-image world-title-os" src="RubinAyoOS.png" alt="Ayo OS">
                <small>Autorski system operacyjny</small>
                <span class="enter">Wkrótce</span>
            </span>
        </a>

        <a class="world world-cradles" href="#" aria-label="Puste Kołyski — w przygotowaniu" data-coming-soon>
            <span class="world-glow" aria-hidden="true"></span>
            <span class="world-copy">
                <span class="world-number">03</span>
                <img class="world-title-image world-title-cradles" src="RubinPusteKolyski.png" alt="Puste Kołyski">
                <small>Opowieść i osobny świat</small>
                <span class="enter">Wkrótce</span>
            </span>
        </a>
    </main>

    <footer>
        <span>© AyoWorlds</span>
        <span>Software · System · Stories</span>
    </footer>

    <script src="script.js?v=20260823-2217"></script>
</body>
</html>
